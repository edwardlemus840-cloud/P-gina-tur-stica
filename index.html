<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayGO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      color: #fff; 
      text-align: center;
      background: url('img/lagocoatepeque.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    header {
      background: linear-gradient(to right, #0077b6, #f77f00);
      padding: 2rem 1rem 1rem;
      color: white;
    }

    header h1 { font-size: 2.5rem; }
    header p { font-size: 1.2rem; }

    nav {
      background-color: #002f6c;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem 0;
      flex-wrap: wrap;
    }

    nav a {
      color: white; 
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: color 0.3s;
    }

    nav a:hover { color: #00b4d8; }

    .main-title { margin: 3rem 1rem 1rem; font-size: 2rem; color: white; }
    .subtitle { font-size: 1.1rem; margin-bottom: 2rem; color: white; }

    .container {
      display: flex; justify-content: center; align-items: center;
      gap: 2rem; flex-wrap: wrap; padding: 2rem;
    }

    .card {
      background: rgba(0, 0, 0, 0.6); 
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      overflow: hidden;
      width: 250px;
      cursor: pointer;
      transition: transform 0.3s;
      text-decoration: none;
      color: white; 
    }

    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card h3 { margin: 0; padding: 1rem; background: rgba(0, 128, 128, 0.8); color: white; }

    footer { background: rgba(51, 51, 51, 0.9); color: white; padding: 1rem; margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <h1>WayGO</h1>
    <p>Descubre Lugares y Restaurantes</p>
  </header>

  <nav>
    <a href="#">Presentación</a>
  </nav>

  <h2 class="main-title">Explora El Salvador</h2>
  <p class="subtitle">Playas, volcanes, pueblos mágicos y gastronomía</p>

  <div class="container">
    <a href="lugares.html" class="card">
      <img src="img/lugares.jpg" alt="Lugares">
      <h3>Lugares</h3>
    </a>

    <a href="restaurantes.html" class="card">
      <img src="img/restaurante.jpg" alt="Restaurantes">
      <h3>Restaurantes</h3>
    </a>
  </div>

  <footer>
    <p>&copy; 2025 App Turística - Todos los derechos reservados</p>
  </footer>

</body>
</html>
