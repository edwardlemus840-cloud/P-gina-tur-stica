<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurantes - App Turística</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      background: url('img/ata.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    header {
      background: linear-gradient(to right, #0077b6, #f77f00);
      padding: 2rem 1rem 1rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
    }

    nav {
      background-color: #002f6c;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem 0;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #00b4d8;
    }

    section {
      max-width: 1200px;
      margin: auto;
      padding: 2rem;
    }

    h2 {
      font-size: 2rem;
      color: white;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 2rem;
    }

    .card {
      background: rgba(0, 119, 182, 0.6);
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      width: 250px;
      cursor: pointer;
      transition: transform 0.3s;
      text-decoration: none;
      color: white;
      backdrop-filter: blur(6px);
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      filter: brightness(95%);
    }

    .card h3 {
      margin: 0;
      padding: 1rem;
      background: linear-gradient(to right, #0077b6, #00b4d8);
      color: white;
      font-size: 1.1rem;
    }

    a.volver {
      display: inline-block;
      margin-top: 40px;
      padding: 10px 20px;
      background: #008080;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }

    a.volver:hover {
      background: #004c4c;
    }
  </style>
</head>
<body>

  <header>
    <h1>Restaurantes</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
  </nav>

  <section>
    <h2>Explora los mejores restaurantes</h2>
    <p>Haz clic en un restaurante para ver más detalles.</p>

    <div class="grid" id="restaurantesGrid">
      <a href="La pampa.html" class="card">
        <img src="img2/pampa.jpg" alt="La Pampa">
        <h3>La Pampa</h3>
      </a>
      <a href="Koi Sushi.html" class="card">
        <img src="img2/koi-sushi.jpg" alt="Koi Sushi">
        <h3>Koi Sushi</h3>
      </a>
      <a href="La Gastroteca.html" class="card">
        <img src="img2/gastroteca.jpg" alt="La Gastroteca">
        <h3>La Gastroteca</h3>
      </a>
      <a href="Rústico Bistro.html" class="card">
        <img src="img2/rustico.jpg" alt="Rústico Bistro">
        <h3>Rústico Bistro</h3>
      </a>
      <a href="Delikat.html" class="card">
        <img src="img2/delikat.jpg" alt="Delikat">
        <h3>Delikat</h3>
      </a>
      <a href="Cadejo Brewing Company.html" class="card">
        <img src="img2/cadejo.jpg" alt="Cadejo Brewing Company">
        <h3>Cadejo Brewing Company</h3>
      </a>
      <a href="haciendareal.html" class="card">
        <img src="img2/hacienda real.jpg" alt="Hacienda real">
        <h3>Hacienda real</h3>
      </a>
      <a href="Brutto.html" class="card">
        <img src="img2/brutto.jpg" alt="Brutto">
        <h3>Brutto</h3>
      </a>
      <a href="donli.html" class="card">
        <img src="img2/don li.jpg" alt="Restaurante Don Li el Salvador">
        <h3>Restaurante Don Li el Salvador</h3>
      </a>
      <a href="Plaza Volcan.html" class="card">
        <img src="img2/plaza volcan.jpg" alt="Plaza Volcan">
        <h3>Plaza Volcan</h3>
      </a>
      <a href="El Xolo.html" class="card">
        <img src="img2/xoco.jpg" alt="El Xolo">
        <h3>El Xolo</h3>
      </a>
      <a href="kamakura.html" class="card">
        <img src="img2/kamakura.jpg" alt="Kamakura">
        <h3>Kamakura</h3>
      </a>
    </div>

    <a href="index.html" class="volver">⬅ Volver al inicio</a>
  </section>
</body>
</html>
